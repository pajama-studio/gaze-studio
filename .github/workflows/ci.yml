name: Verify
on:
  push:
    paths-ignore: ["docs/**", "*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "*.md", "LICENSE"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --skipLibCheck worker/index.ts
      - run: npx playwright install --with-deps chromium
      - run: npx wrangler d1 migrations apply gaze-studio --local --config wrangler.test.jsonc
      - run: npx wrangler r2 object put gaze-studio-test/examples/gazemining-amazon.webm --file public/datasets/gazemining-amazon.webm --content-type video/webm --local --config wrangler.test.jsonc
      - name: Verify browser and local Cloudflare APIs
        run: |
          npx wrangler dev --port 8798 --config wrangler.test.jsonc > /tmp/gaze-worker.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8798/api/health && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:8798 node scripts/verify-api.mjs
          BASE_URL=http://127.0.0.1:8798 node scripts/verify-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/verification/
